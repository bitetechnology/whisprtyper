version: 1
id: whisprtyper-navbar-liquid-glass
mobile:
  strategy: same-material-two-row
  maxDpr: 2
reducedMotion:
  strategy: static
reducedTransparency:
  strategy: opaque-surface
scenes:
  - id: page
    selector: body
    background: "#F7F4ED"
    overflowX: hidden
  - id: hero-through-pill-flow
    selector: "#hero-stage"
    ariaHidden: true
    overflow: hidden
    viewBox: rendered-css-pixels
    path:
      id: hero-path
      shape: shallow two-cubic valley
      starts: off-left
      crosses: measured pill center
      ends: off-right
      textDistortion: none
    conveyor:
      transcriptCopies: 2
      renderedLayersPerCopy: 2
      inputLayer:
        clip: hero-clip-in
        color: "rgba(76, 74, 70, 0.58)"
      outputLayer:
        clip: hero-clip-out
        color: "#F7F7EB"
      sharedPath: hero-path
      sharedOffset: exact per copy pair
      opacity: 1
      speedPxPerSecond: 78
      gapEm: 2.4
      loop: modulo-two-pitches
    ribbon:
      selector: ".hero-ribbon"
      path: hero-path
      clip: hero-clip-out
      stroke: "#111113"
      strokeWidthDesktop: 34
      strokeWidthMobile: 28
      layer: beneath output text and pill
    pill:
      selector: ".hero-pill"
      center: shared path crossing
      background: "rgba(255, 254, 245, 0.96)"
      border: "2px solid #111113"
      layer: above input and output
      waveform:
        bars: 10
        driver: same transportPx as text
        cssKeyframes: disabled
        scaleRange: [0.5, 1.12]
      pulse:
        driver: same transportPx as text
        scaleRange: [1.0, 1.012]
    forbiddenHeroStates:
      - finalizing-spinner
      - inserted-checkmark
      - static-output-card
      - per-word-opacity
      - random-word-position
    mobile:
      strategy: same-connected-horizontal-composition
      details: shallower valley, 13.5px text, 1.05x pill, 28px ribbon, clipped contiguous segments on both sides
    reducedMotion:
      strategy: static-shared-path-diagram
      transport: stopped
      waveform: static
      pillPulse: stopped
    lifecycle:
      suspendWhenOffscreen: true
      suspendWhenDocumentHidden: true
      resizeObserver: true
      maxFrameDeltaMs: 250
    noAudioApis: true
  - id: interactive-demo
    selector: "#voice-demo"
    interaction: pointer-keyboard-control
    audioCapture: false
    states:
      - idle
      - recording
      - finalizing
    finalizingDurationMs: 800
sequences:
  - id: hero-through-pill-text-ribbon
    trigger: intersection
    loop: continuous
    speedPxPerSecond: 78
    render: native-svg-textPath-shared-offsets
    phases:
      - name: flow
        range: continuous
        input: muted sentence moving toward pill
        pill: deterministic waveform and subtle pulse
        output: identical moving sentence on black ribbon
    easing: linear-transport
    accessibility:
      reducedMotion: static through-pill diagram
      noJs: authored static paired offsets
      forcedColors: CanvasText ribbon with Canvas output text
      contrast: input and tags on warm canvas; ivory output on black ribbon
    performance:
      compositorOnly: false
      mainThreadWork: four startOffset writes plus ten bar transforms per frame
      maxDpr: 2
  - id: supporting-decorative-motion
    render: css
    sequences:
      - id: interactive-demo-waveform
        render: css keyframe pill-bar during user-triggered recording
      - id: interactive-demo-spinner
        render: css keyframe pill-spin during user-triggered finalizing
      - id: viewport-reveal
        render: css keyframe reveal-in behind intersection observer
